name: Run NN Random ECC

on:
  workflow_dispatch:

jobs:
  run-nn-random-ecc:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run NN random ECC analysis
        run: python scripts/nn_random_ecc.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: nn-random-ecc-result
          path: nn_random_ecc_result.json

