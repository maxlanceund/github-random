name: Fetch GW170817 posterior
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download low spin PhenomPNRT dat sample
        run: |
          wget https://dcc.ligo.org/public/0146/P1800061/011/low_spin_PhenomPNRT_posterior_samples.dat.gz
          gunzip low_spin_PhenomPNRT_posterior_samples.dat.gz

      - name: Convert dat to csv
        run: |
          python3 -c "
import csv
out = open('gw170817_posterior.csv', 'w')
w = csv.writer(out)
w.writerow(['mass_1','mass_2','lambda_tilde'])
with open('low_spin_PhenomPNRT_posterior_samples.dat','r') as f:
    for line in f:
        line = line.strip()
        if not line or line.startswith('#'):
            continue
        parts = line.split()
        m1 = parts[0]
        m2 = parts[1]
        lamt = parts[10]
        w.writerow([m1,m2,lamt])
out.close()
          "

      - name: Commit csv file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add gw170817_posterior.csv
          git commit -m "Generate GW170817 posterior csv from DCC dat (no h5py)" || echo "No new csv, skip commit"
          git push
