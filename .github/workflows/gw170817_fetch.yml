name: Fetch GW170817 posterior
on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch lowSpin.dat and convert to csv
        run: |
          wget https://dcc.ligo.org/public/0157/P1800061/003/lowSpin.dat -O lowSpin.dat
          echo "mass_1,mass_2,lambda_tilde" > gw170817_posterior.csv
          awk '{print $1","$2","$3}' lowSpin.dat >> gw170817_posterior.csv
      - name: Commit csv
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add gw170817_posterior.csv
          git commit -m "add GW170817 lowSpin posterior csv with lambda_tilde"
          git push
