name: Fetch GW170817 posterior
on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get GW170817 lowspin h5 sample
        run: |
          wget https://gwosc.org/dataset/GW170817/posterior_samples/GW170817_PhenomPNRT_lowSpin_posterior_samples.h5

      - name: Install h5py via pip
        run: |
          python3 -m pip install h5py

      - name: Convert h5 to csv
        run: |
          python3 - <<PY
import h5py, csv
with h5py.File("GW170817_PhenomPNRT_lowSpin_posterior_samples.h5","r") as f:
    m1 = f["posterior_samples"]["mass_1"]
    m2 = f["posterior_samples"]["mass_2"]
    lamt = f["posterior_samples"]["lambda_tilde"]
with open("gw170817_posterior.csv","w") as fw:
    w = csv.writer(fw)
    w.writerow(["mass_1","mass_2","lambda_tilde"])
    for a,b,c in zip(m1,m2,lamt):
        w.writerow([float(a), float(b), float(c)])
PY

      - name: Commit csv file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add gw170817_posterior.csv
          git commit -m "Generate GW170817 posterior csv (pip h5py)" || echo "No new csv file generated"
          git push
