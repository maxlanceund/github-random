name: Run Ising Simulation

on:
  workflow_dispatch:

jobs:
  run-ising:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install numpy
        run: pip install numpy

      - name: Run Ising simulation
        run: python scripts/ising.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ising-result
          path: scripts/ising.py
