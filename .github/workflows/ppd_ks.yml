name: PPD KS Calculation
on:
  workflow_dispatch:
jobs:
  ppd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy pandas scipy
      - name: Run PPD KS
        run: python ppd_ks.py
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: ppd-out
          path: |
            ppd_result.txt
            ppd_arrays.npz
