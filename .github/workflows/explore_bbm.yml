name: Explore BBM Data

on:
  workflow_dispatch:

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clone BBM repo
        run: git clone --depth 1 https://github.com/sybila/biodivine-boolean-models.git bbm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Explore data
        run: python scripts/explore_bbm.py
