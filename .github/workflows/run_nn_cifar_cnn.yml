name: Run NN CIFAR CNN

on:
  workflow_dispatch:

jobs:
  run-nn-cifar-cnn:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run NN CIFAR CNN analysis
        run: python scripts/nn_cifar_cnn.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: nn-cifar-cnn-result
          path: nn_cifar_cnn_result.json
