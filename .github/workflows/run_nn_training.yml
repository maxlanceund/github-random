name: Run NN Training Dynamics

on:
  workflow_dispatch:

jobs:
  run-nn-training:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run NN training dynamics
        run: python scripts/nn_training.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: nn-training-result
          path: nn_training_result.json
