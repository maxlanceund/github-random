name: Run Observer Relativity
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy
      - run: python scripts/observer_relativity.py
      - uses: actions/upload-artifact@v4
        with:
          name: observer-result
          path: observer_relativity_result.json
          if-no-files-found: error
