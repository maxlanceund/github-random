name: Run Entanglement Geometry

on:
  workflow_dispatch:

jobs:
  run-ent-geom:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy scipy

      - name: Run entanglement geometry simulation
        run: python scripts/entanglement_geometry.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ent-geom-result
          path: entanglement_geometry_result.json
