name: Run NN ECC Dynamics

on:
  workflow_dispatch:

jobs:
  run-nn-ecc-dyn:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run NN ECC dynamics analysis
        run: python scripts/nn_ecc_dynamics.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: nn-ecc-dyn-result
          path: nn_ecc_dynamics_result.json
