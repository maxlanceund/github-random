name: Run Quantum Chaos Simulation

on:
  workflow_dispatch:

jobs:
  run-quantum:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy scipy

      - name: Run quantum chaos simulation
        run: python scripts/quantum_chaos.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: quantum-chaos-result
          path: quantum_chaos_result.json
