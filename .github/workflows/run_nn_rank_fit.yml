name: Run NN Rank Fit

on:
  workflow_dispatch:

jobs:
  run-nn-rank-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run NN rank fit analysis
        run: python scripts/nn_rank_fit.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: nn-rank-fit-result
          path: nn_rank_fit_result.json
