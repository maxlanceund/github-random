name: GW170817 preprocess hdf5 to csv

on:
  push:
    branches: [ main ]

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install numpy pandas gwpy

      - name: Run gwpy script to fetch posterior and export csv
        run: python gw_fetch_posterior.py

      - name: Commit generated csv
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: gw170817_posterior.csv
          commit_message: Auto-generate GW170817 posterior csv via gwpy
