name: GW170817 preprocess hdf5 to csv

on:
  push:
    branches: [ main ]

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install numpy h5py pandas

      - name: Download full GWTC-1 sample release tarball
        run: |
          wget -c https://dcc.ligo.org/public/0157/P1800370/002/GWTC-1_sample_release.tar.gz
          tar -xf GWTC-1_sample_release.tar.gz

      - name: Convert GW170817 hdf5 to csv
        run: python gw_h5_to_csv.py

      - name: Commit generated csv
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: gw170817_posterior.csv
          commit_message: Auto-generate GW170817 posterior csv from GWTC-1 full sample release
