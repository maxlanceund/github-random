name: GW170817 preprocess hdf5 to csv

on:
  push:
    branches: [ main ]

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install numpy h5py pandas

      - name: Download GW170817 lowspin posterior hdf5 (stable mirror)
        run: |
          wget -c -O GW170817_lowspin.hdf5 https://www.gw-openscience.org/eventapi/html/GW170817/v3/GW170817-IMRPhenomPv2NRT_lowSpin_posterior.hdf5

      - name: Convert hdf5 to csv
        run: python gw_h5_to_csv.py

      - name: Commit generated csv
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: gw170817_posterior.csv
          commit_message: Auto-generate GW170817 lowspin posterior csv
