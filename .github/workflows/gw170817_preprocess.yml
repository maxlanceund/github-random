name: GW170817 preprocess hdf5 to csv

on:
  push:
    branches: [ main ]

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install numpy h5py pandas

      # 改用wget从gwosc镜像下载GWTC‑1 GW170817后验
      - name: Download GW170817 posterior hdf5 from GWOSC
        run: |
          wget -O GW170817_GWTC-1.hdf5 https://gwosc.org/eventapi/json/GWTC-1-confident/GW170817/v3/posterior.hdf5

      - name: Run convert hdf5 to csv
        run: python gw_h5_to_csv.py

      - name: Commit generated csv
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: gw170817_posterior.csv
          commit_message: Auto‑generate GW170817 posterior csv
