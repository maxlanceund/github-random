name: Run NN MI Matrix

on:
  workflow_dispatch:

jobs:
  run-nn-mi:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run NN MI matrix analysis
        run: python scripts/nn_mi_matrix.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: nn-mi-result
          path: nn_mi_matrix_result.json
