name: Run NN Damage Types

on:
  workflow_dispatch:

jobs:
  run-nn-damage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run NN damage types analysis
        run: python scripts/nn_damage_types.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: nn-damage-result
          path: nn_damage_types_result.json
