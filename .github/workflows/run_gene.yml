name: Run Gene Network D_f

on:
  workflow_dispatch:

jobs:
  run-gene:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy numba

      - name: Run gene network simulation
        run: python scripts/gene_network.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: gene-result
          path: gene_network_result.json
