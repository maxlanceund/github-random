name: Run Fast Ising (numba)

on:
  workflow_dispatch:

jobs:
  run-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy numba

      - name: Run fast Ising simulation
        run: python scripts/fast_ising.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: fast-ising-result
          path: fast_ising_result.json
