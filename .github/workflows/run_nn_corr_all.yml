name: Run NN Correlation All Layers

on:
  workflow_dispatch:

jobs:
  run-nn-corr-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run NN correlation all layers analysis
        run: python scripts/nn_corr_all_layers.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: nn-corr-all-result
          path: nn_corr_all_layers_result.json
