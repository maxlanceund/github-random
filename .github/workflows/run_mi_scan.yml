name: Run Mutual Info Scan
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy
      - run: python scripts/mutual_info_scan.py
      - uses: actions/upload-artifact@v4
        with:
          name: mi-scan-result
          path: mutual_info_scan_result.json
          if-no-files-found: error
