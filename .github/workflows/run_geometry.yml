name: Run Emergent Geometry

on:
  workflow_dispatch:

jobs:
  run-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy

      - name: Run emergent geometry simulation
        run: python scripts/emergent_geometry.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: geometry-result
          path: emergent_geometry_result.json
