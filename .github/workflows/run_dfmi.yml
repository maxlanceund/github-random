name: Run D_f vs Mutual Info

on:
  workflow_dispatch:

jobs:
  run-dfmi:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy

      - name: Run D_f vs mutual info
        run: python scripts/d_f_vs_mutual_info.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: dfmi-result
          path: d_f_vs_mi_result.json
