name: Run Entanglement Geometry 2
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python scripts/entanglement_geometry2.py
      - uses: actions/upload-artifact@v4
        with:
          name: ent-geom2-result
          path: entanglement_geometry2_result.json
