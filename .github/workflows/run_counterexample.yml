name: Run Counterexample Gap

on:
  workflow_dispatch:

jobs:
  run-counter:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy

      - name: Run counterexample gap test
        run: python scripts/counterexample_gap.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: counterexample-result
          path: counterexample_gap_result.json
