name: Blackhole_Data_Convert
on: [push, workflow_dispatch]
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: '3.10' }
      
    # 核心魔法：把 129M 的大文件缓存起来
    - name: Cache HDF5 Data
      uses: actions/cache@v4
      with:
        path: GW150914_posterior.h5
        key: ${{ runner.os }}-gw150914-h5-v1
        
    - run: pip install numpy h5py
    - run: python h5_to_csv.py
    
    - name: 自动提交 CSV 到仓库
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-generated real blackhole CSV"
        file_pattern: '*.csv'
