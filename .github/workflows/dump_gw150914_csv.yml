name: dump-gw150914-csv-one-shot
on:
  workflow_dispatch:

jobs:
  dumpcsv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install deps
        run: pip install h5py numpy pandas

      - name: Download full GWTC-1 sample tarball (LIGO DCC, not zenodo)
        run: |
          wget --user-agent="Mozilla/5.0" -O GWTC-1_sample_release.tar.gz https://dcc.ligo.org/public/0157/P1800370/001/GWTC-1_sample_release.tar.gz
          tar -xf GWTC-1_sample_release.tar.gz

      - name: convert GW150914 h5 to csv
        run: python dump_gw150914.py

      - name: upload csv as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gw150914-posterior-csv
          path: posterior_samples_GW150914.csv
