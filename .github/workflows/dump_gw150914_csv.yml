name: dump-gw150914-csv-one-shot
on:
  workflow_dispatch:

jobs:
  dumpcsv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install deps
        run: pip install h5py numpy pandas

      - name: Download GW150914 posterior from GWOSC
        run: wget --user-agent="Mozilla/5.0" -O GW150914_posterior.h5 https://gwosc.org/eventapi/json/GW150914-v3/posterior_samples.h5

      - name: convert h5 to csv
        run: python dump_gw150914.py

      - name: upload csv as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gw150914-posterior-csv
          path: posterior_samples_GW150914.csv
