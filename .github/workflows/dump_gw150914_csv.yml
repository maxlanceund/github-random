name: dump-gw150914-csv-one-shot
on:
  workflow_dispatch:

jobs:
  dumpcsv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install deps
        run: pip install h5py numpy pandas

      - name: Download GWTC-1 full posteriors zenodo
        run: |
          wget --user-agent="Mozilla/5.0" -O GWTC-1_posteriors.tar.gz https://zenodo.org/record/3976528/files/GWTC-1_posteriors.tar.gz
          tar -xf GWTC-1_posteriors.tar.gz

      - name: convert h5 to csv
        run: python dump_gw150914.py

      - name: upload csv artifact
        uses: actions/upload-artifact@v4
        with:
          name: gw150914-posterior-csv
          path: posterior_samples_GW150914.csv
