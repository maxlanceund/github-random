name: dump-gw150914-csv-one-shot
on:
  workflow_dispatch:

jobs:
  dumpcsv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install gwosc pandas

      - name: Run python script to get posterior samples
        run: python dump_gw150914.py

      - name: Upload csv as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gw150914-posterior-csv
          path: posterior_samples_GW150914.csv
