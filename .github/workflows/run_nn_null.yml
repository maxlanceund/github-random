name: Run NN Null Test

on:
  workflow_dispatch:

jobs:
  run-nn-null:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run NN null test
        run: python scripts/nn_null_test.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: nn-null-result
          path: nn_null_test_result.json
