name: Run D_f Phase Detector

on:
  workflow_dispatch:

jobs:
  run-phasedet:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy

      - name: Run D_f phase detector
        run: python scripts/d_f_phase_detector.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: phasedet-result
          path: d_f_phase_detector_result.json
