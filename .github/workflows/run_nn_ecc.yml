name: Run NN ECC Verify

on:
  workflow_dispatch:

jobs:
  run-nn-ecc:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run NN ECC verification
        run: python scripts/nn_ecc_verify.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: nn-ecc-result
          path: nn_ecc_verify_result.json
