name: GW170817 + GW150914 preprocess hdf5 to csv
on: push
jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install python
        run: pip install h5py
      - name: download GWTC-1 sample
        run: |
          mkdir -p GWTC-1_sample_release
          wget https://dcc.ligo.org/public/0157/P1800370/004/GWTC-1_sample_release.tar.gz
          tar -zxf GWTC-1_sample_release.tar.gz
      - name: run gw170817
        run: python extract_gw170817.py
      - name: run gw150914
        run: python extract_gw150914.py
      - name: list csv files
        run: ls -l *.csv
      - uses: actions/upload-artifact@v4
        with:
          name: gwtc1-csv-output
          path: |
            gw170817_lambda.csv
            gw150914.csv
