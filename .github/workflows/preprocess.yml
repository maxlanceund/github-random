name: GW170817 preprocess hdf5 to csv
on:
  push:
    branches: [ main ]

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install h5py numpy

      - name: Download GWTC-1 data
        run: |
          wget --user-agent="Mozilla/5.0" https://dcc.ligo.org/public/0157/GWTC-1/001/GWTC-1_sample_release.tar.gz
          tar -xf GWTC-1_sample_release.tar.gz

      - name: Run extract script
        run: python extract_gw170817.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gw170817-lambda-csv
          path: gw170817_lambda.csv
