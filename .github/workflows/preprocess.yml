name: GW170817 preprocess hdf5 to csv
on:
  push:
    branches: [ main ]

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install h5py numpy

      - name: Download full GWTC-1 sample release tarball
        run: |
          wget --user-agent="Mozilla/5.0" https://dcc.ligo.org/public/0157/GWTC-1/001/GWTC-1_sample_release.tar.gz
          tar -xf GWTC-1_sample_release.tar.gz

      - name: Inspect hdf5 structure
        run: |
          python3 -c "import h5py; f=h5py.File('./GWTC-1_sample_release/GW170817_GWTC-1.hdf5','r'); print(list(f.keys()))"

      - name: Extract GW170817 lambda csv
        run: |
          python3 - <<PY
import h5py,csv
h5_path='./GWTC-1_sample_release/GW170817_GWTC-1.hdf5'
out_name='gw170817_lambda.csv'
with h5py.File(h5_path,'r') as f:
    grp=f['IMRPhenomPv2NRT_lowSpin_posterior']['samples']
    m1=grp['mass_1']
    m2=grp['mass_2']
    lamt=grp['lambda_tilde']
with open(out_name,'w',newline='') as fw:
    w=csv.writer(fw)
    w.writerow(['mass_1','mass_2','lambda_tilde'])
    for a,b,c in zip(m1,m2,lamt):
        w.writerow([float(a),float(b),float(c)])
print('csv generated')
PY

      - name: Upload csv as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gw170817-lambda-csv
          path: gw170817_lambda.csv
