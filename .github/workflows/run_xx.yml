name: Run XX Entanglement

on:
  workflow_dispatch:

jobs:
  run-xx:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy

      - name: Run XX entanglement simulation
        run: python scripts/xx_entanglement.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: xx-result
          path: xx_result.json
