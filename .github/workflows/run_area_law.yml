name: Run Area Law
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python scripts/area_law.py
      - uses: actions/upload-artifact@v4
        with:
          name: area-law-result
          path: area_law_result.json
