name: Run NN Entropy Bound

on:
  workflow_dispatch:

jobs:
  run-nn-entropy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run NN entropy bound analysis
        run: python scripts/nn_entropy_bound.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: nn-entropy-result
          path: nn_entropy_bound_result.json
