name: Run Central PBC
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy
      - run: python scripts/central_pbc.py
      - uses: actions/upload-artifact@v4
        with:
          name: central-pbc-result
          path: central_pbc_result.json
          if-no-files-found: error
