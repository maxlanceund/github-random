name: Run NN Info Migration

on:
  workflow_dispatch:

jobs:
  run-nn-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run NN info migration analysis
        run: python scripts/nn_info_migration.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: nn-migration-result
          path: nn_info_migration_result.json
