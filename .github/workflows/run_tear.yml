name: Run Spacetime Tear
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python scripts/spacetime_tear.py
      - uses: actions/upload-artifact@v4
        with:
          name: tear-result
          path: spacetime_tear_result.json
